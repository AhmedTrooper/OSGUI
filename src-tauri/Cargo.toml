[package]
name = "synclime"
version = "0.1.0"
description = "High-performance media extraction pipeline powered by yt-dlp, FFmpeg, and dynamic JS runtimes."
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "synclime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5.15"
parking_lot = "0.12.5"
chrono = "0.4.44"
tokio = { version = "1.52.3", features = ["full"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
url = "2.5.8"
axum = "0.7.5"
tower-http = { version = "0.5.2", features = ["cors"] }
reqwest = { version = "0.12.12", features = ["json"] }
directories = "6.0.0"
opener = "0.8.4"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
thiserror = "2"
anyhow = "1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Tauri commands pass one argument per frontend field by convention.
too_many_arguments = "allow"
# A handful of public DTOs intentionally mirror the frontend snake/camel
# casing — the wire format is the contract, not the Rust name.
module_name_repetitions = "allow"
# `must_use_candidate` triggers on every `HashMap::insert`, `Vec::push`,
# `Command::arg`, etc. Far too noisy to be useful here.
must_use_candidate = "allow"
# Lots of `slug` / `job_slug` / `parsed_file_slug` pairs exist by design.
similar_names = "allow"
# Tauri commands are required to be `async` even when they do not await;
# e.g. most of the commands in `src/commands/`. Suppress the noisy lint.
unused_async = "allow"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
